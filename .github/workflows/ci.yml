name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Prepare FFmpeg and ffprobe
        run: ./scripts/ci/prepare-ffmpeg.ps1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python for image workers
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Prepare isolated image worker and verified CPU model
        run: ./scripts/ci/prepare-image-worker.ps1

      - name: Setup Node for the Electron installer
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare Windows desktop and isolated Bun
        if: runner.os == 'Windows'
        run: ./scripts/setup_sfs.ps1 -IncludeDesktop

      - name: Verify runtime paths and versions
        run: |
          Get-Command bun, ffmpeg, ffprobe | Format-Table Name, Source
          bun --revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun apps/cli/src/index.ts doctor --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck
        run: |
          bun run typecheck 2>&1 | Tee-Object -FilePath fixtures/generated/ci-artifacts/typecheck.txt
          exit $LASTEXITCODE

      - name: Test
        run: |
          bun test tests --reporter=junit --reporter-outfile=fixtures/generated/ci-artifacts/tests.xml 2>&1 | Tee-Object -FilePath fixtures/generated/ci-artifacts/tests.txt
          exit $LASTEXITCODE

      - name: Python image tests
        run: |
          $imagePython = if ($IsWindows) { '.venv-image/Scripts/python.exe' } else { '.venv-image/bin/python' }
          & $imagePython -m pytest workers/image/tests -q
          exit $LASTEXITCODE

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.os }}
          include-hidden-files: true
          path: |
            fixtures/generated/ci-artifacts/
            fixtures/generated/background-window/**/console.json
            fixtures/generated/gui-visible-start/**/.sfs/gui-evidence/desktop-report.json
